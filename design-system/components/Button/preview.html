<!-- @dsCard group="Actions" height=410 width=600 subtitle="Prominent, glass, call (Android), neutral, destructive and plain; app and browser page" -->
<div class="tml-buttons">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
  <style>
    .tml-buttons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; box-sizing: border-box; min-height: 410px; padding: 16px; background: var(--ground); font-family: var(--font-text); color: var(--ink); }
    .tml-buttons .col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .tml-buttons .cap { margin: 0 0 0 4px; font-size: 13px; line-height: 18px; letter-spacing: -0.08px; color: var(--ink-secondary); }
    .tml-buttons .stage + .cap { margin-top: 6px; }
    .tml-buttons .stage { position: relative; overflow: hidden; box-sizing: border-box; padding: 12px; border-radius: var(--radius-lg); display: flex; flex-direction: column; gap: 8px; }
    .tml-buttons .stage-map { flex: 1; justify-content: space-between; background: var(--map-land); }
    .tml-buttons .stage-plain { justify-content: center; background: var(--surface); }
    .tml-buttons .tml-map { position: absolute; inset: 0; width: 100%; height: 100%; }
    .tml-buttons .m-land { fill: var(--map-land); }
    .tml-buttons .m-water { fill: var(--map-water); }
    .tml-buttons .m-park { fill: var(--map-park); }
    .tml-buttons .m-road path { stroke: var(--map-road); stroke-width: 8; fill: none; stroke-linecap: round; }
    .tml-buttons .m-major path { stroke: var(--map-road-major); stroke-width: 14; fill: none; stroke-linecap: round; }
    .tml-buttons .bar { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .tml-buttons .stack { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
    .tml-buttons .row { position: relative; display: flex; gap: 8px; }
    /* A button never grows on its own; only inside a row do buttons share the width. */
    .tml-btn { position: relative; flex: none; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border: 0; border-radius: var(--radius-pill); font-family: var(--font-text); font-size: 17px; line-height: 22px; font-weight: 600; letter-spacing: -0.43px; text-align: center; cursor: pointer; }
    .tml-buttons .row .tml-btn { flex: 1 1 0; }
    .tml-btn svg { width: 18px; height: 18px; flex: none; }
    .tml-btn:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
    .tml-btn-bar { min-height: 44px; padding: 0 16px; }
    .tml-btn-icon { width: 44px; min-height: 44px; padding: 0; }
    .tml-btn-icon svg { width: 20px; height: 20px; }
    .tml-btn-hug { align-self: flex-start; }
    .tml-btn-plain-sm { min-height: 44px; }
    .tml-btn-prominent { background: var(--lamplight); color: var(--on-lamplight); }
    .tml-btn-viewer { background: var(--crossing); color: var(--on-crossing); }
    .tml-btn-glass { background: var(--glass-fill); color: var(--ink); box-shadow: inset 0 0 0 1px var(--glass-edge), inset 0 1px 0 var(--glass-highlight); -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%); }
    .tml-btn-call { background: var(--connected-wash); color: var(--connected); }
    .tml-btn-neutral { background: var(--surface-raised); color: var(--ink); }
    .tml-btn-destructive { background: var(--flare-wash); color: var(--flare-text); }
    .tml-btn-plain { background: transparent; color: var(--ink); }
    .tml-btn-plain-web { background: transparent; color: var(--crossing-text); }
  </style>

  <div class="col">
    <p class="cap">In the app, over the map</p>
    <div class="stage stage-map">
      <svg class="tml-map" viewBox="0 0 240 346" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect class="m-land" x="0" y="0" width="240" height="346"></rect>
        <path class="m-water" d="M-10 262 C 50 244 110 284 170 262 C 205 250 225 242 250 246 L 250 360 L -10 360 Z"></path>
        <rect class="m-park" x="140" y="84" width="88" height="80" rx="18"></rect>
        <g class="m-road"><path d="M-10 74 L250 52"></path><path d="M-10 176 L250 152"></path><path d="M44 -10 L62 360"></path><path d="M132 -10 L142 360"></path><path d="M214 -10 L222 360"></path></g>
        <g class="m-major"><path d="M-10 226 C 80 206 160 170 250 110"></path></g>
      </svg>
      <div class="bar">
        <button class="tml-btn tml-btn-glass tml-btn-bar" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2"></circle><circle cx="12" cy="12" r="2.2" fill="currentColor"></circle><path d="M12 2.5v3.5M12 18v3.5M2.5 12H6M18 12h3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>Center the map</button>
        <button class="tml-btn tml-btn-glass tml-btn-icon" type="button" aria-label="Close" title="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path></svg></button>
      </div>
      <div class="stack">
        <button class="tml-btn tml-btn-call tml-btn-hug" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h3.5l1.8 4.6-2.3 1.6a12 12 0 0 0 5.8 5.8l1.6-2.3L20 14.5V18a2 2 0 0 1-2 2A15 15 0 0 1 3 5a2 2 0 0 1 2-2z" fill="currentColor"></path></svg>Back to call</button>
        <button class="tml-btn tml-btn-prominent" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3 L3 10.5 L11 13 L13.5 21 Z" fill="currentColor"></path></svg>Share live location</button>
      </div>
    </div>
  </div>

  <div class="col">
    <p class="cap">In the app, in a sheet</p>
    <div class="stage stage-plain">
      <button class="tml-btn tml-btn-neutral" type="button">Change timer</button>
      <button class="tml-btn tml-btn-destructive" type="button">Stop sharing</button>
      <button class="tml-btn tml-btn-plain tml-btn-plain-sm" type="button">Not now</button>
    </div>
    <p class="cap">On the browser page</p>
    <div class="stage stage-plain">
      <button class="tml-btn tml-btn-viewer" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3 L3 10.5 L11 13 L13.5 21 Z" fill="currentColor"></path></svg>Share my location</button>
      <button class="tml-btn tml-btn-plain-web tml-btn-plain-sm" type="button">Not now</button>
    </div>
  </div>
</div>
