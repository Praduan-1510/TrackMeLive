<!-- @dsCard group="Map" height=336 width=960 subtitle="Live, approximate (on the viewer's page) and last seen" -->
<div class="tml-markers">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
  <style>
    .tml-markers { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px; box-sizing: border-box; min-height: 336px; padding: 16px; background: var(--ground); font-family: var(--font-text); color: var(--ink); }
    .tml-markers .col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .tml-markers .cap { margin: 0 0 0 4px; font-size: 13px; line-height: 18px; letter-spacing: -0.08px; color: var(--ink-secondary); }
    .tml-markers .stage { position: relative; height: 280px; border-radius: var(--radius-lg); overflow: hidden; background: var(--map-land); }
    .tml-markers .tml-map, .tml-markers .overlay { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    .tml-markers .m-land { fill: var(--map-land); }
    .tml-markers .m-water { fill: var(--map-water); }
    .tml-markers .m-park { fill: var(--map-park); }
    .tml-markers .m-road path { stroke: var(--map-road); stroke-width: 8; fill: none; stroke-linecap: round; }
    .tml-markers .m-major path { stroke: var(--map-road-major); stroke-width: 14; fill: none; stroke-linecap: round; }
    /* caption-2 in map-label: 11pt, never uppercase */
    .tml-markers .m-label { fill: var(--map-label); font-family: var(--font-text); font-size: 11px; font-weight: 400; letter-spacing: 0.06px; }
    .tml-markers .line { stroke: var(--ink); stroke-opacity: 0.6; stroke-width: 2; stroke-dasharray: 4 7; stroke-linecap: round; fill: none; }
    /* Trail: full-opacity dots, lamplight-text in light and lamplight in dark; age shows by size, 8px newest to 4px oldest. */
    .tml-markers .trail circle { fill: var(--lamplight-text); }
    [data-theme="dark"] .tml-markers .trail circle { fill: var(--lamplight); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme]) .tml-markers .trail circle { fill: var(--lamplight); } }
    .mk { position: absolute; width: 0; height: 0; }
    .mk-halo { position: absolute; border-radius: 50%; }
    .mk-area { position: absolute; border-radius: 50%; background: var(--lamplight-halo); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--lamplight) 45%, transparent); }
    .mk-disc { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 50%; box-shadow: var(--shadow-marker); }
    .mk-disc img { width: 40px; height: 40px; display: block; }
    .mk-disc svg { width: 24px; height: 24px; display: block; fill: currentColor; }
    .mk-name { position: absolute; left: -70px; width: 140px; display: flex; justify-content: center; }
    .mk-name span { padding: 2px 9px; border-radius: var(--radius-pill); background: var(--surface); color: var(--ink); font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; box-shadow: inset 0 0 0 1px var(--separator); }
    /* Sharer: 52pt surface disc, 3pt lamplight ring, 1pt on-lamplight keyline outside it, 80pt halo. */
    .mk-sharer .mk-halo { left: -40px; top: -40px; width: 80px; height: 80px; background: var(--lamplight-halo); }
    .mk-sharer .mk-disc { left: -26px; top: -26px; width: 52px; height: 52px; background: var(--surface); border: 3px solid var(--lamplight); box-shadow: 0 0 0 1px var(--on-lamplight), var(--shadow-marker); }
    .mk-sharer .mk-name { top: 34px; }
    /* Approximate: the 1 km circle (150px here) replaces the halo. */
    .mk-approx .mk-area { left: -75px; top: -75px; width: 150px; height: 150px; }
    /* Viewer: 48pt crossing disc, 3pt surface ring, 72pt halo. */
    .mk-viewer .mk-halo { left: -36px; top: -36px; width: 72px; height: 72px; background: var(--crossing-halo); }
    .mk-viewer .mk-disc { left: -24px; top: -24px; width: 48px; height: 48px; background: var(--crossing); border: 3px solid var(--surface); color: var(--on-crossing); font-family: var(--font-display); font-size: 18px; font-weight: 700; }
    .mk-viewer .mk-name { top: 32px; }
    /* Last seen: dashed ink-tertiary ring, no halo, no shadow. */
    .mk-seen .mk-disc { box-shadow: none; border-style: dashed; border-color: var(--ink-tertiary); }
    .mk-seen.mk-sharer .mk-disc img { opacity: 0.55; }
    .mk-seen.mk-viewer .mk-disc { background: var(--surface-raised); color: var(--ink-secondary); }
    .mk-seen .mk-name span { color: var(--ink-secondary); }
    .tml-markers .chip { position: absolute; transform: translate(-50%, -50%); padding: 3px 10px; border-radius: var(--radius-pill); background: var(--ink); color: var(--ground); font-family: var(--font-display); font-size: 15px; line-height: 20px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    /* After each ping: one bob over 2.4 s and one breath of the halo, then rest (a ping every 5 s here). */
    .mk-live .mk-disc { animation: tml-bob 5s ease-in-out infinite; }
    .mk-live .mk-halo { animation: tml-breathe 5s ease-in-out infinite; }
    @keyframes tml-bob { 0%, 48%, 100% { transform: translateY(0); } 24% { transform: translateY(-3px); } }
    @keyframes tml-breathe { 0%, 40%, 100% { transform: scale(1); opacity: 1; } 20% { transform: scale(1.08); opacity: 0.8; } }
    @media (prefers-reduced-motion: reduce) { .mk-live .mk-disc, .mk-live .mk-halo { animation: none; } }
  </style>
