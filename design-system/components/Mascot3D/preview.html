  <script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const { CAST, ACCENTS } = (() => {
// Track Me Live mascots, second wave: the Anime set and the Movie night set.
// All eight are original characters. None is drawn from a real person or an existing anime.
// Same studio and scale as mascots.mjs: a head of radius ~1 at the origin, facing +Z,
// with the shoulders of a vinyl bust below it.
//
// Every builder takes (THREE, { accent, deep }) to recolor the one part people customize:
// hair and the hoodie take the bright tone, garments and felt take the deep one.
// Skin never changes with the color.

const ss = (x, a, b) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};
const mix = (a, b, t) => a + (b - a) * t;
function rng(seed) {
  let s = seed >>> 0;
  return () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296);
}

const SKIN = {
  porcelain: 0xf6d5bd,
  peach: 0xefc3a2,
  sand: 0xd9a37a,
  umber: 0xa86c47,
  cocoa: 0x7b4a2f,
};

// The picker's five swatches: [bright for hair and the hoodie, deep for garments and felt].
// "original" keeps each character's own colors.
const ACCENTS = {
  original: null,
  moss: [0x8f9c38, 0x5f6b26],
  lagoon: [0x279c8e, 0x1d7a70],
  dusk: [0x5b7fd6, 0x3f5ea8],
  rose: [0xd65d8c, 0xa8406a],
};

// ---------- Materials ----------

const M = {
  skin: (THREE, c, vc = false) => new THREE.MeshPhysicalMaterial({
    color: vc ? 0xffffff : c, vertexColors: vc, roughness: 0.5, sheen: 0.55, sheenRoughness: 0.55,
    sheenColor: new THREE.Color(c).lerp(new THREE.Color(0xffe2d0), 0.55), clearcoat: 0.12, clearcoatRoughness: 0.55,
  }),
  hair: (THREE, c, vc = false, o = {}) => new THREE.MeshPhysicalMaterial({
    color: vc ? 0xffffff : c, vertexColors: vc, roughness: o.roughness ?? 0.34, clearcoat: o.clearcoat ?? 0.55,
    clearcoatRoughness: o.clearcoatRoughness ?? 0.22, sheen: 0.35, sheenRoughness: 0.35,
    sheenColor: new THREE.Color(c).lerp(new THREE.Color(0xffffff), 0.35),
  }),
  fabric: (THREE, c, o = {}) => new THREE.MeshPhysicalMaterial({
    color: c, vertexColors: !!o.vc, roughness: o.roughness ?? 0.78, sheen: o.sheen ?? 0.45, sheenRoughness: o.sheenRoughness ?? 0.6,
    sheenColor: new THREE.Color(o.tint ?? c).lerp(new THREE.Color(0xffffff), (o.sheenMix ?? 0.45) * 0.6), side: o.side ?? THREE.FrontSide,
  }),
  leather: (THREE, c, o = {}) => new THREE.MeshPhysicalMaterial({
    color: c, roughness: o.roughness ?? 0.42, clearcoat: o.clearcoat ?? 0.45, clearcoatRoughness: 0.35, side: o.side ?? THREE.FrontSide,
  }),
  gloss: (THREE, c) => new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.04 }),
  metal: (THREE, c, r = 0.25) => new THREE.MeshPhysicalMaterial({ color: c, metalness: 1, roughness: r, clearcoat: 0.6, clearcoatRoughness: 0.12 }),
  white: (THREE) => new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false }),
};

function mesh(THREE, geo, mat, o = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = o.cast !== false;
  m.receiveShadow = true;
  if (o.p) m.position.set(o.p[0], o.p[1], o.p[2]);
  if (o.s) m.scale.set(o.s[0], o.s[1], o.s[2]);
  if (o.r) m.rotation.set(o.r[0], o.r[1], o.r[2]);
  return m;
}

function paint(THREE, geo, fn) {
  const pos = geo.attributes.position;
  const out = new Float32Array(pos.count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    fn(pos.getX(i), pos.getY(i), pos.getZ(i), c, i);
    out[i * 3] = c.r; out[i * 3 + 1] = c.g; out[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(out, 3));
  return geo;
}

// ---------- Head ----------
// A sphere with soft chibi cheeks and a gently tapered chin. shape() maps a unit direction to
// the head surface, so hair and hoods can follow the same form at a larger radius.

function makeHead(THREE, { skin, jaw = 0.12, width = 1, blush = 0.25, seg = [192, 144] }) {
  const shape = (v) => {
    const low = ss(-v.y, 0.05, 1.0);
    v.x *= width * (1 - jaw * low);
    v.z *= 1 - 0.5 * jaw * low;
    v.y *= 0.96;
    return v;
  };
  const geo = new THREE.SphereGeometry(1, seg[0], seg[1]);
  geo.rotateY(-Math.PI / 2);
  const p = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    shape(v);
    p.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();

  const base = new THREE.Color(skin);
  const warm = base.clone().multiply(new THREE.Color(1.0, 0.8, 0.78));
  const shade = base.clone().multiplyScalar(0.8);
  paint(THREE, geo, (x, y, z, c) => {
    const ch = (sx) => Math.exp(-(((x - 0.52 * sx) / 0.2) ** 2 + ((y + 0.3) / 0.15) ** 2));
    const cheeks = Math.max(ch(1), ch(-1)) * ss(z, 0.2, 0.6);
    const nose = Math.exp(-((x / 0.12) ** 2 + ((y + 0.22) / 0.12) ** 2)) * ss(z, 0.7, 0.95);
    c.copy(base).lerp(warm, Math.min(1, cheeks * blush + nose * 0.35)).lerp(shade, 0.35 * ss(-y, 0.7, 0.98));
  });

  const surf = (x, y) => {
    const uy = y / 0.96;
    const low = ss(-uy, 0.05, 1.0);
    const sx = width * (1 - jaw * low), sz = 1 - 0.5 * jaw * low;
    const ux = x / sx;
    const uz = Math.sqrt(Math.max(0, 1 - ux * ux - uy * uy));
    return {
      p: new THREE.Vector3(x, y, uz * sz),
      n: new THREE.Vector3(ux / sx, uy / 0.96, uz / sz).normalize(),
    };
  };
  const mat = M.skin(THREE, skin, true);
  const plain = M.skin(THREE, skin);
  return { geo, shape, surf, mat, plain, mesh: mesh(THREE, geo, mat) };
}

// Put an object on the face at (x, y), pushed out along the surface normal, facing outward.
function place(H, obj, x, y, out = 0, spin = 0) {
  const { p, n } = H.surf(x, y);
  obj.position.copy(p).addScaledVector(n, out);
  obj.lookAt(obj.position.clone().add(n));
  if (spin) obj.rotateZ(spin);
  return obj;
}

// A shell that follows the head at radius r where mask = 1 and sinks inside it where mask = 0.
// The slope between the two reads as a sculpted hairline or the thick edge of a hood.
function shellGeo(THREE, H, { r = 1.07, inner = 0.88, mask, bump, color, seg = [288, 216] }) {
  const geo = new THREE.SphereGeometry(1, seg[0], seg[1]);
  geo.rotateY(-Math.PI / 2);
  const p = geo.attributes.position;
  const d = new THREE.Vector3(), v = new THREE.Vector3();
  const cols = color ? new Float32Array(p.count * 3) : null;
  const c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    d.fromBufferAttribute(p, i);
    const m = mask(d.x, d.y, d.z);
    let rr = mix(inner, r, m);
    if (bump) rr += bump(d.x, d.y, d.z) * m;
    v.copy(d);
    H.shape(v).multiplyScalar(rr);
    p.setXYZ(i, v.x, v.y, v.z);
    if (cols) {
      color(d.x, d.y, d.z, c);
      cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b;
    }
  }
  if (cols) geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  geo.computeVertexNormals();
  return geo;
}

// A point on a shell of radius r above unit direction (x, y, z).
function onShell(THREE, H, x, y, z, r) {
  return H.shape(new THREE.Vector3(x, y, z).normalize()).multiplyScalar(r);
}

// ---------- Swept shapes ----------
// A tapered tube along a curve. The cross-section is an ellipse: w scales it along the surface,
// d scales it along "out" (away from center), so flat hair locks lie on the head.

function strandGeo(THREE, pts, o = {}) {
  const { r = 0.1, w = 1, d = 1, seg = 48, rad = 20, prof = (t) => 1 - t, center = [0, 0, 0], colors = null, cap = false } = o;
  const curve = new THREE.CatmullRomCurve3(pts.map((q) => new THREE.Vector3(q[0], q[1], q[2])), !!o.closed, 'catmullrom', 0.5);
  const P = new THREE.Vector3(), T = new THREE.Vector3(), O = new THREE.Vector3();
  const Wv = new THREE.Vector3(), N = new THREE.Vector3(), C0 = new THREE.Vector3(center[0], center[1], center[2]);
  const pos = [], col = [], idx = [];
  const ca = colors && new THREE.Color(colors[0]), cb = colors && new THREE.Color(colors[1]), cc = new THREE.Color();
  for (let i = 0; i <= seg; i++) {
    const t = i / seg;
    curve.getPointAt(t, P);
    curve.getTangentAt(t, T).normalize();
    if (o.out) O.set(o.out[0], o.out[1], o.out[2]); else O.subVectors(P, C0);
    O.normalize();
    Wv.crossVectors(T, O);
    if (Wv.lengthSq() < 1e-8) Wv.set(0, 1, 0).cross(T);
    Wv.normalize();
    N.crossVectors(Wv, T).normalize();
    const k = Math.max(0, prof(t)) * r;
    for (let j = 0; j < rad; j++) {
      const a = (j / rad) * Math.PI * 2;
      const cs = Math.cos(a) * k * w, sn = Math.sin(a) * k * d;
      pos.push(P.x + Wv.x * cs + N.x * sn, P.y + Wv.y * cs + N.y * sn, P.z + Wv.z * cs + N.z * sn);
      if (colors) {
        cc.copy(ca).lerp(cb, o.colorAt ? o.colorAt(t) : t);
        col.push(cc.r, cc.g, cc.b);
      }
    }
  }
  for (let i = 0; i < seg; i++) {
    for (let j = 0; j < rad; j++) {
      const a = i * rad + j, b = i * rad + ((j + 1) % rad), c = (i + 1) * rad + j, e = (i + 1) * rad + ((j + 1) % rad);
      idx.push(a, c, b, b, c, e);
    }
  }
  if (cap) {
    const start = pos.length / 3;
    const p0 = curve.getPointAt(0);
    for (let j = 0; j < rad; j++) {
      pos.push(pos[j * 3], pos[j * 3 + 1], pos[j * 3 + 2]);
      if (colors) col.push(col[j * 3], col[j * 3 + 1], col[j * 3 + 2]);
    }
    pos.push(p0.x, p0.y, p0.z);
    if (colors) col.push(ca.r, ca.g, ca.b);
    const ci = start + rad;
    for (let j = 0; j < rad; j++) idx.push(ci, start + j, start + ((j + 1) % rad));
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  if (colors) geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}

const PROF = {
  spike: (t) => Math.pow(1 - t, 0.85) * (0.82 + 0.18 * ss(t, 0, 0.25)),
  lock: (t) => Math.pow(1 - t, 0.75) * (0.7 + 0.3 * Math.sin(Math.PI * Math.min(1, t * 1.6 + 0.2))),
  brow: (t) => Math.pow(Math.sin(Math.PI * (0.08 + 0.84 * t)), 0.6) * (1.1 - 0.35 * t),
  even: (t) => 0.55 + 0.45 * Math.pow(Math.sin(Math.PI * t), 0.35),
  tail: (t) => (0.65 + 0.35 * Math.sin(Math.PI * Math.min(1, t * 1.3))) * (1 - 0.6 * ss(t, 0.85, 1)),
};

function lathe(THREE, pts, seg = 160) {
  return new THREE.LatheGeometry(pts.map(([x, y]) => new THREE.Vector2(x, y)), seg, Math.PI, Math.PI * 2);
}

function smoothPts(THREE, pts, n = 64) {
  return new THREE.SplineCurve(pts.map(([x, y]) => new THREE.Vector2(x, y))).getPoints(n).map((v) => [v.x, v.y]);
}

function deform(geo, fn) {
  const p = geo.attributes.position;
  const v = { x: 0, y: 0, z: 0 };
  for (let i = 0; i < p.count; i++) {
    v.x = p.getX(i); v.y = p.getY(i); v.z = p.getZ(i);
    fn(v);
    p.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}

function extrude(THREE, outline, { depth = 0.04, bevel = 0.02, seg = 4, curve = 24 } = {}) {
  const s = new THREE.Shape();
  outline(s);
  return new THREE.ExtrudeGeometry(s, {
    depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: seg, curveSegments: curve,
  });
}

// ---------- Bust ----------
// Shoulders under the head. zAt(x, y) gives the chest surface, so collars and lapels can sit on it.

function makeBust(THREE, { shoulder = 0.9, depth = 0.62, top = -0.98, base = 0xffffff, paintFn } = {}) {
  const prof = smoothPts(THREE, [
    [0.001, top], [0.26, top], [0.34, top - 0.03], [0.55, top - 0.12], [0.75, top - 0.24],
    [shoulder, top - 0.4], [shoulder + 0.02, top - 0.56], [shoulder + 0.02, top - 0.7], [shoulder - 0.02, top - 0.735], [0.001, top - 0.74],
  ], 80);
  // Lathe profiles run bottom to top, or the faces point inward.
  const geo = lathe(THREE, prof.slice().reverse(), 192);
  deform(geo, (v) => { v.z *= depth; });
  const ys = prof.map((q) => q[1]), rs = prof.map((q) => q[0]);
  const rAt = (y) => {
    for (let i = 0; i < ys.length - 1; i++) {
      if ((y <= ys[i] && y >= ys[i + 1])) return mix(rs[i], rs[i + 1], (ys[i] - y) / (ys[i] - ys[i + 1] || 1));
    }
    return 0;
  };
  const zAt = (x, y) => {
    const r = rAt(y);
    return depth * Math.sqrt(Math.max(0, r * r - x * x));
  };
  const bc = new THREE.Color(base);
  paint(THREE, geo, (x, y, z, c) => {
    if (paintFn) paintFn(x, y, z, c); else c.copy(bc);
    c.multiplyScalar(mix(1, 0.5, ss(top - 0.5 - y, 0, 0.22)));
  });
  return { geo, zAt, rAt, top, THREE };
}

// Split triangles until no edge is longer than maxEdge, then weld, so a flat piece can bend
// without its middle sinking below the surface it lies on.
function tessellate(THREE, geo, maxEdge = 0.025) {
  const src = geo.index ? geo.toNonIndexed() : geo;
  const P = src.attributes.position, U = src.attributes.uv;
  const outP = [], outU = [];
  const emit = (...vs) => vs.forEach((v) => { outP.push(v.p[0], v.p[1], v.p[2]); outU.push(v.u[0], v.u[1]); });
  const mid = (a, b) => ({ p: a.p.map((x, i) => (x + b.p[i]) / 2), u: a.u.map((x, i) => (x + b.u[i]) / 2) });
  const len = (a, b) => Math.hypot(a.p[0] - b.p[0], a.p[1] - b.p[1], a.p[2] - b.p[2]);
  const split = (a, b, c, d) => {
    const ab = len(a, b), bc = len(b, c), ca = len(c, a);
    const m = Math.max(ab, bc, ca);
    if (m <= maxEdge || d > 14) return emit(a, b, c);
    if (m === ab) { const q = mid(a, b); split(a, q, c, d + 1); split(q, b, c, d + 1); }
    else if (m === bc) { const q = mid(b, c); split(a, b, q, d + 1); split(a, q, c, d + 1); }
    else { const q = mid(c, a); split(a, b, q, d + 1); split(q, b, c, d + 1); }
  };
  const V = (i) => ({ p: [P.getX(i), P.getY(i), P.getZ(i)], u: U ? [U.getX(i), U.getY(i)] : [0, 0] });
  for (let i = 0; i < P.count; i += 3) split(V(i), V(i + 1), V(i + 2), 0);
  const key = new Map(), pos = [], uv = [], idx = [];
  for (let i = 0; i < outP.length / 3; i++) {
    const k = `${Math.round(outP[i * 3] * 1e5)},${Math.round(outP[i * 3 + 1] * 1e5)},${Math.round(outP[i * 3 + 2] * 1e5)}`;
    let j = key.get(k);
    if (j === undefined) {
      j = pos.length / 3;
      key.set(k, j);
      pos.push(outP[i * 3], outP[i * 3 + 1], outP[i * 3 + 2]);
      uv.push(outU[i * 2], outU[i * 2 + 1]);
    }
    idx.push(j);
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  out.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  out.setIndex(idx);
  return out;
}

// Bend a flat extruded piece (drawn in x/y at z = 0..depth) onto the chest.
function onChest(B, geo, lift = 0.012) {
  const THREE = B.THREE;
  return deform(tessellate(THREE, geo), (v) => { v.z = B.zAt(v.x, v.y) + lift + v.z; });
}

function neck(THREE, H, r = 0.27) {
  return mesh(THREE, new THREE.CylinderGeometry(r, r * 1.1, 0.5, 64), H.plain, { p: [0, -0.86, -0.05] });
}

// ---------- Printed face ----------
// Faces are printed onto a thin skin over the front of the head, the way vinyl figures are
// pad-printed. draw() paints on a canvas in head units: X(x), Y(y), S(size).

function faceDecal(THREE, H, { W = 1.7, cy = -0.12, px = 1024, draw, gloss = false }) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = px;
  const ctx = cv.getContext('2d');
  const X = (x) => (x / W + 0.5) * px, Y = (y) => (0.5 - (y - cy) / W) * px, S = (s) => (s / W) * px;
  draw(ctx, { X, Y, S, px });
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;

  const src = H.geo;
  const pos = src.attributes.position, nor = src.attributes.normal;
  const out = new Float32Array(pos.count * 3), uv = new Float32Array(pos.count * 2);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    out[i * 3] = x + nor.getX(i) * 0.004;
    out[i * 3 + 1] = y + nor.getY(i) * 0.004;
    out[i * 3 + 2] = z + nor.getZ(i) * 0.004;
    uv[i * 2] = x / W + 0.5;
    uv[i * 2 + 1] = (y - cy) / W + 0.5;
  }
  const keep = [];
  const index = src.index.array;
  for (let k = 0; k < index.length; k += 3) {
    const a = index[k], b = index[k + 1], c = index[k + 2];
    if (pos.getZ(a) > 0.25 && pos.getZ(b) > 0.25 && pos.getZ(c) > 0.25) keep.push(a, b, c);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(out, 3));
  geo.setAttribute('normal', nor.clone());
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.setIndex(keep);
  const mat = new THREE.MeshPhysicalMaterial({
    map: tex, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2,
    roughness: gloss ? 0.18 : 0.5, clearcoat: gloss ? 1 : 0.1, clearcoatRoughness: gloss ? 0.05 : 0.5,
  });
  return mesh(THREE, geo, mat, { cast: false });
}

const rgba = (hex, a = 1) => {
  const n = typeof hex === 'number' ? hex : parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
};

// An anime eye: broad upper lid with a winged lash line, a tall gradient iris, layered highlights.
// side = +1 draws the eye on the character's left (viewer's right); the outer corner faces outward.
function animeEye(ctx, o) {
  const { x, y, w, h, side, iris, lash = '#2a1712', sharp = 0, star = false, lid = 0 } = o;
  const top = (c) => {
    c.moveTo(-0.5 * w, 0.1 * h);
    c.bezierCurveTo(-0.44 * w, (-0.38 + 0.3 * sharp + lid) * h, 0.28 * w, (-0.6 + 0.35 * sharp + lid) * h, 0.53 * w, (-0.14 + 0.08 * sharp) * h);
  };
  const shape = (c) => {
    c.beginPath();
    top(c);
    c.bezierCurveTo(0.5 * w, (0.28 - 0.1 * sharp) * h, 0.26 * w, (0.5 - 0.12 * sharp) * h, 0.0, (0.5 - 0.12 * sharp) * h);
    c.bezierCurveTo(-0.3 * w, (0.48 - 0.12 * sharp) * h, -0.47 * w, 0.32 * h, -0.5 * w, 0.1 * h);
    c.closePath();
  };
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(side, 1);

  // White, shaded under the lid.
  shape(ctx);
  ctx.fillStyle = '#fbf8f4';
  ctx.fill();
  ctx.save();
  shape(ctx);
  ctx.clip();
  let g = ctx.createLinearGradient(0, -0.5 * h, 0, 0.1 * h);
  g.addColorStop(0, 'rgba(120,110,140,0.45)');
  g.addColorStop(1, 'rgba(120,110,140,0)');
  ctx.fillStyle = g;
  ctx.fillRect(-w, -h, 2 * w, 2 * h);

  // Iris.
  const ix = 0.04 * w, iy = 0.06 * h, irx = 0.37 * w, iry = (0.5 - 0.06 * sharp) * h;
  ctx.beginPath();
  ctx.ellipse(ix, iy, irx, iry, 0, 0, Math.PI * 2);
  g = ctx.createLinearGradient(0, iy - iry, 0, iy + iry);
  g.addColorStop(0, iris[0]);
  g.addColorStop(0.45, iris[1]);
  g.addColorStop(1, iris[2]);
  ctx.fillStyle = g;
  ctx.fill();
  // Warm glow rising from the bottom of the iris.
  g = ctx.createRadialGradient(ix, iy + iry * 0.62, 0, ix, iy + iry * 0.62, irx * 1.05);
  g.addColorStop(0, rgba(iris[3] || iris[2], 0.85));
  g.addColorStop(1, rgba(iris[3] || iris[2], 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(ix, iy, irx, iry, 0, 0, Math.PI * 2);
  ctx.fill();
  // Fine radial fibers.
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(ix, iy, irx, iry, 0, 0, Math.PI * 2);
  ctx.clip();
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = Math.max(1, w * 0.008);
  for (let k = 0; k < 28; k++) {
    const a = (k / 28) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(ix + Math.cos(a) * irx * 0.35, iy + Math.sin(a) * iry * 0.35);
    ctx.lineTo(ix + Math.cos(a) * irx * 0.92, iy + Math.sin(a) * iry * 0.92);
    ctx.stroke();
  }
  ctx.restore();
  // Rim and pupil.
  ctx.beginPath();
  ctx.ellipse(ix, iy, irx, iry, 0, 0, Math.PI * 2);
  ctx.lineWidth = w * 0.035;
  ctx.strokeStyle = rgba(iris[0], 0.9);
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(ix, iy - 0.02 * h, irx * 0.42, iry * 0.46, 0, 0, Math.PI * 2);
  ctx.fillStyle = rgba(iris[0], 0.95);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(ix, iy - 0.02 * h, irx * 0.24, iry * 0.28, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#120a10';
  ctx.fill();
  // Lid shadow over the top of the iris.
  g = ctx.createLinearGradient(0, -0.55 * h, 0, -0.05 * h);
  g.addColorStop(0, 'rgba(20,10,20,0.55)');
  g.addColorStop(1, 'rgba(20,10,20,0)');
  ctx.fillStyle = g;
  ctx.fillRect(-w, -h, 2 * w, 2 * h);
  ctx.restore();

  // Upper lash line, heavier toward the outer corner, with a wing.
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = lash;
  ctx.fillStyle = lash;
  ctx.beginPath();
  top(ctx);
  ctx.lineWidth = 0.1 * h;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0.2 * w, (-0.47 + 0.3 * sharp + lid * 0.8) * h);
  ctx.quadraticCurveTo(0.5 * w, (-0.36 + 0.2 * sharp) * h, 0.66 * w, (-0.3 + 0.1 * sharp) * h);
  ctx.quadraticCurveTo(0.6 * w, (-0.12 + 0.05 * sharp) * h, 0.5 * w, (-0.06 + 0.06 * sharp) * h);
  ctx.closePath();
  ctx.fill();
  // Two lashes flicking out.
  for (const [sx, sy, ex, ey] of [[0.42, -0.32, 0.62, -0.5], [0.3, -0.42, 0.42, -0.62]]) {
    ctx.beginPath();
    ctx.moveTo(sx * w, (sy + 0.3 * sharp) * h);
    ctx.quadraticCurveTo(((sx + ex) / 2 + 0.06) * w, ((sy + ey) / 2 + 0.3 * sharp) * h, ex * w, (ey + 0.3 * sharp) * h);
    ctx.lineWidth = 0.035 * h;
    ctx.stroke();
  }
  // Lower lash and the crease above the lid.
  ctx.beginPath();
  ctx.moveTo(0.5 * w, 0.08 * h);
  ctx.quadraticCurveTo(0.45 * w, 0.36 * h, 0.22 * w, (0.47 - 0.12 * sharp) * h);
  ctx.lineWidth = 0.035 * h;
  ctx.strokeStyle = rgba(0x3a2018, 0.7);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-0.3 * w, (-0.5 + 0.3 * sharp) * h);
  ctx.quadraticCurveTo(0.15 * w, (-0.74 + 0.35 * sharp) * h, 0.45 * w, (-0.52 + 0.3 * sharp) * h);
  ctx.lineWidth = 0.025 * h;
  ctx.strokeStyle = rgba(0x3a2018, 0.4);
  ctx.stroke();
  ctx.restore();

  // Highlights stay on the same side for both eyes, as if lit by one lamp.
  const hx = x + side * ix;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.ellipse(hx - 0.13 * w, y - 0.12 * h, 0.13 * w, 0.11 * h, -0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(hx + 0.14 * w, y + 0.26 * h, 0.055 * w, 0, Math.PI * 2);
  ctx.fill();
  if (star) {
    ctx.save();
    ctx.translate(hx + 0.12 * w, y - 0.04 * h);
    ctx.beginPath();
    for (let k = 0; k < 8; k++) {
      const a = (k / 8) * Math.PI * 2 - Math.PI / 2, rr = k % 2 ? 0.025 * w : 0.075 * w;
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

function happyEye(ctx, { x, y, w, h, lash = '#2a1712' }) {
  ctx.save();
  ctx.lineCap = 'round';
  ctx.strokeStyle = lash;
  ctx.lineWidth = 0.22 * h;
  ctx.beginPath();
  ctx.moveTo(x - 0.5 * w, y + 0.22 * h);
  ctx.bezierCurveTo(x - 0.35 * w, y - 0.45 * h, x + 0.35 * w, y - 0.45 * h, x + 0.5 * w, y + 0.22 * h);
  ctx.stroke();
  ctx.restore();
}

function blush(ctx, { X, Y, S }, { x = 0.52, y = -0.3, r = 0.16, color = 0xf28b8b, a = 0.5, hatch = true }) {
  for (const sx of [-1, 1]) {
    const cx = X(x * sx), cy = Y(y);
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, S(r));
    g.addColorStop(0, rgba(color, a));
    g.addColorStop(1, rgba(color, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(cx, cy, S(r), S(r * 0.62), 0, 0, Math.PI * 2);
    ctx.fill();
    if (hatch) {
      ctx.strokeStyle = rgba(0xe0505a, 0.55);
      ctx.lineWidth = S(0.012);
      ctx.lineCap = 'round';
      for (let k = -1; k <= 1; k++) {
        ctx.beginPath();
        ctx.moveTo(cx + S(0.045 * k - 0.02), cy + S(0.035));
        ctx.lineTo(cx + S(0.045 * k + 0.025), cy - S(0.035));
        ctx.stroke();
      }
    }
  }
}

function stroke(ctx, pts, { width, color, cap = 'round' }) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  if (pts.length === 3) ctx.quadraticCurveTo(pts[1][0], pts[1][1], pts[2][0], pts[2][1]);
  else if (pts.length === 4) ctx.bezierCurveTo(pts[1][0], pts[1][1], pts[2][0], pts[2][1], pts[3][0], pts[3][1]);
  else ctx.lineTo(pts[1][0], pts[1][1]);
  ctx.lineCap = cap;
  ctx.lineWidth = width;
  ctx.strokeStyle = color;
  ctx.stroke();
}

// Stubble: fine speckle over the jaw and upper lip, plus a faint shadow.
function stubble(ctx, { X, Y, S }, { color = 0x2a2420, a = 0.32, n = 9000, seed = 7, region, shadow = 0.1 }) {
  const rand = rng(seed);
  ctx.save();
  ctx.filter = `blur(${Math.round(S(0.03))}px)`;
  ctx.fillStyle = rgba(color, shadow);
  ctx.beginPath();
  ctx.moveTo(X(-0.8), Y(-0.3));
  ctx.quadraticCurveTo(X(-0.55), Y(-0.48), X(-0.22), Y(-0.4));
  ctx.lineTo(X(0.22), Y(-0.4));
  ctx.quadraticCurveTo(X(0.55), Y(-0.48), X(0.8), Y(-0.3));
  ctx.lineTo(X(0.7), Y(-0.95));
  ctx.lineTo(X(-0.7), Y(-0.95));
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  const inside = region || ((x, y) => {
    const jaw = y < -0.28 - 0.25 * Math.abs(x) * Math.abs(x) && Math.abs(x) < 0.82;
    const mouth = Math.abs(x) < 0.17 && y < -0.42 && y > -0.6;
    const lip = Math.abs(x) < 0.22 && y < -0.36 && y > -0.46;
    return (jaw && !mouth) || lip;
  });
  for (let k = 0; k < n; k++) {
    const x = (rand() - 0.5) * 1.7, y = -0.2 - rand() * 0.8;
    if (!inside(x, y)) continue;
    ctx.fillStyle = rgba(color, a * (0.5 + rand() * 0.5));
    ctx.beginPath();
    ctx.arc(X(x), Y(y), S(0.0022 + rand() * 0.0022), 0, Math.PI * 2);
    ctx.fill();
  }
}

// ---------- Sculpted face parts (movie set) ----------

function realEye(THREE, H, g, { x, y, r = 0.098, lid = 0.3, lidTilt = 0, lower = 0.12, lash = 0x241612, iris = 0x4a3020, skin, look = [0, 0.1, 5] }) {
  const eye = new THREE.Group();
  place(H, eye, x, y, -r * 0.3);
  eye.lookAt(new THREE.Vector3(...look));
  const white = new THREE.MeshPhysicalMaterial({ color: 0xf3efe9, roughness: 0.2, clearcoat: 1, clearcoatRoughness: 0.04 });
  const ball = new THREE.Group();
  ball.add(mesh(THREE, new THREE.SphereGeometry(r, 64, 48), white));
  const cap = (rr, ang, mat) => mesh(THREE, new THREE.SphereGeometry(rr, 64, 16, 0, Math.PI * 2, 0, ang), mat, { r: [Math.PI / 2, 0, 0], cast: false });
  const irisCol = new THREE.Color(iris);
  const irisMat = new THREE.MeshPhysicalMaterial({ color: irisCol, roughness: 0.2, clearcoat: 1, clearcoatRoughness: 0.03 });
  const ringMat = new THREE.MeshPhysicalMaterial({ color: irisCol.clone().multiplyScalar(0.45), roughness: 0.2, clearcoat: 1 });
  ball.add(cap(r * 1.004, 0.66, ringMat));
  ball.add(cap(r * 1.008, 0.58, irisMat));
  ball.add(cap(r * 1.012, 0.27, M.gloss(THREE, 0x0b0706)));
  ball.add(mesh(THREE, new THREE.SphereGeometry(r * 0.12, 16, 12), M.white(THREE), { p: [-r * 0.24, r * 0.24, r * 0.97], cast: false }));
  ball.scale.set(1.15, 1, 1);
  eye.add(ball);
  // Upper lid: a dome of skin tipped down over the eye, with a dark lash edge. lid 0 = wide open, 1 = shut.
  const lr = r * 1.1;
  const upper = new THREE.Group();
  upper.add(mesh(THREE, new THREE.SphereGeometry(lr, 64, 24, 0, Math.PI * 2, 0, Math.PI / 2), skin, { s: [1.2, 1, 1.02] }));
  upper.add(mesh(THREE, new THREE.TorusGeometry(lr, r * 0.075, 12, 64, Math.PI), M.gloss(THREE, lash), { r: [Math.PI / 2, 0, 0], s: [1.2, 1, 1.02] }));
  upper.rotation.x = mix(-0.75, 0.9, lid);
  upper.rotation.z = lidTilt;
  eye.add(upper);
  const low = new THREE.Group();
  low.add(mesh(THREE, new THREE.SphereGeometry(lr * 0.99, 64, 24, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), skin, { s: [1.2, 1, 1.02] }));
  low.rotation.x = mix(0.9, -0.2, lower);
  eye.add(low);
  g.add(eye);
  return eye;
}

function sculptBrow(THREE, H, g, { x0, y0, x1, y1, arch = 0.04, r = 0.045, color, side = 1 }) {
  const pts = [];
  for (let k = 0; k <= 6; k++) {
    const t = k / 6;
    const x = mix(x0, x1, t) * side, y = mix(y0, y1, t) + Math.sin(Math.PI * t) * arch;
    const { p, n } = H.surf(x, y);
    p.addScaledVector(n, 0.01);
    pts.push([p.x, p.y, p.z]);
  }
  g.add(mesh(THREE, strandGeo(THREE, pts, { r, w: 1, d: 0.42, prof: PROF.brow, seg: 40, rad: 16 }), M.hair(THREE, color, false, { roughness: 0.6, clearcoat: 0.2 })));
}

function ears(THREE, H, g, { y = -0.12, s = 1 } = {}) {
  const inner = new THREE.MeshPhysicalMaterial({ color: new THREE.Color(H.plain.color).multiplyScalar(0.82), roughness: 0.6, sheen: 0.4 });
  for (const sx of [-1, 1]) {
    const e = new THREE.Group();
    e.position.set(0.97 * sx, y, -0.04);
    e.rotation.set(0, 0.5 * sx, 0.08 * sx);
    e.add(mesh(THREE, new THREE.SphereGeometry(0.13 * s, 48, 32), H.plain, { s: [0.62, 1.45, 0.95] }));
    e.add(mesh(THREE, new THREE.SphereGeometry(0.09 * s, 32, 24), inner, { p: [0.03 * sx, 0, 0.0], s: [0.45, 1.3, 0.8] }));
    g.add(e);
  }
}

function nose(THREE, H, g, { y = -0.24, s = 1, w = 1 } = {}) {
  const geo = new THREE.SphereGeometry(1, 96, 72);
  deform(geo, (v) => {
    const t = ss(v.y, -1, 1);
    const wing = Math.exp(-(((v.y + 0.55) / 0.35) ** 2)) * ss(Math.abs(v.x), 0.3, 0.9);
    v.x *= mix(1.0 + 0.25 * w * wing, 0.42, t);
    v.z *= mix(1.0, 0.5, t) * (1 - 0.35 * wing);
    v.y *= 1;
  });
  const n = new THREE.Group();
  place(H, n, 0, y + 0.06 * s, -0.035);
  n.add(mesh(THREE, geo, H.plain, { s: [0.105 * s, 0.17 * s, 0.1 * s], p: [0, 0, 0.0] }));
  g.add(n);
}

// Painted lips: a line, a soft lower lip with a highlight, and a shadow under it.
function lips(ctx, { X, Y, S }, { y = -0.5, w = 0.13, curve = 0, smirk = 0, tone = 0x7a3b2e, line = '#3a1a12' }) {
  const L = [X(-w), Y(y + 0.01 - smirk * 0.3)], C = [X(0), Y(y - 0.012 + curve)], R = [X(w), Y(y + 0.01 + smirk)];
  ctx.fillStyle = rgba(tone, 0.32);
  ctx.beginPath();
  ctx.moveTo(L[0], L[1]);
  ctx.quadraticCurveTo(C[0], C[1], R[0], R[1]);
  ctx.quadraticCurveTo(X(0), Y(y - 0.11), L[0], L[1]);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.beginPath();
  ctx.ellipse(X(0.01), Y(y - 0.055), S(0.045), S(0.014), 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = rgba(tone, 0.16);
  ctx.beginPath();
  ctx.moveTo(X(-w * 0.85), Y(y + 0.035 - smirk * 0.2));
  ctx.quadraticCurveTo(X(0), Y(y + 0.075), X(w * 0.85), Y(y + 0.035 + smirk * 0.8));
  ctx.quadraticCurveTo(X(0), Y(y + 0.01), X(-w * 0.85), Y(y + 0.035 - smirk * 0.2));
  ctx.fill();
  stroke(ctx, [L, C, R], { width: S(0.02), color: line });
  ctx.fillStyle = 'rgba(30,15,10,0.18)';
  ctx.beginPath();
  ctx.ellipse(X(0), Y(y - 0.15), S(0.06), S(0.018), 0, 0, Math.PI * 2);
  ctx.fill();
}

// ---------- Hats ----------

function brimGeo(THREE, r0, r1, t, curl) {
  const e = 0.035;
  const prof = [[r0, 0], [r1 - e, -0.004], [r1 - 0.006, 0.006], [r1, t * 0.5], [r1 - 0.006, t - 0.006], [r1 - e, t + 0.002], [r0, t], [r0, 0]];
  const geo = lathe(THREE, prof, 256);
  return deform(geo, (v) => { v.y += curl(v.x, v.z); });
}

// ---------- Bow ----------

function bowGeo(THREE, s = 1) {
  const g = new THREE.Group();
  const wing = extrude(THREE, (sh) => {
    sh.moveTo(0, 0.04 * s);
    sh.bezierCurveTo(0.12 * s, 0.1 * s, 0.26 * s, 0.2 * s, 0.32 * s, 0.13 * s);
    sh.bezierCurveTo(0.37 * s, 0.05 * s, 0.37 * s, -0.05 * s, 0.32 * s, -0.13 * s);
    sh.bezierCurveTo(0.26 * s, -0.2 * s, 0.12 * s, -0.1 * s, 0, -0.04 * s);
  }, { depth: 0.04 * s, bevel: 0.035 * s, seg: 6 });
  return { wing };
}

// =====================================================================
// Anime set
// =====================================================================

function hero(THREE, { accent } = {}) {
  const g = new THREE.Group();
  const hairC = new THREE.Color(accent ?? 0xec7e2a);
  const H = makeHead(THREE, { skin: SKIN.peach, jaw: 0.13, blush: 0.3 });
  g.add(H.mesh);

  g.add(faceDecal(THREE, H, {
    draw(ctx, k) {
      const { X, Y, S } = k;
      blush(ctx, k, { x: 0.56, y: -0.34, r: 0.15, a: 0.42 });
      for (const sx of [-1, 1]) {
        animeEye(ctx, { x: X(0.36 * sx), y: Y(-0.1), w: S(0.31), h: S(0.34), side: sx, sharp: 0.25, iris: ['#3a1d10', '#8a4a1c', '#e8a24a', '#ffd27a'] });
        // Determined brows: inner ends low.
        stroke(ctx, [[X(0.16 * sx), Y(0.13)], [X(0.32 * sx), Y(0.22)], [X(0.52 * sx), Y(0.22)]], { width: S(0.055), color: rgba(hairC.clone().multiplyScalar(0.55).getHex()) });
      }
      // Big open grin.
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(X(-0.15), Y(-0.47));
      ctx.quadraticCurveTo(X(0), Y(-0.5), X(0.15), Y(-0.47));
      ctx.bezierCurveTo(X(0.13), Y(-0.62), X(-0.13), Y(-0.62), X(-0.15), Y(-0.47));
      ctx.closePath();
      ctx.fillStyle = '#5b1d22';
      ctx.fill();
      ctx.clip();
      ctx.fillStyle = '#f07f86';
      ctx.beginPath();
      ctx.ellipse(X(0.02), Y(-0.6), S(0.09), S(0.05), 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fffaf4';
      ctx.fillRect(X(-0.16), Y(-0.455), S(0.32), S(0.04));
      ctx.restore();
      stroke(ctx, [[X(-0.155), Y(-0.465)], [X(-0.175), Y(-0.45)]], { width: S(0.014), color: '#7a3b30' });
      stroke(ctx, [[X(0.155), Y(-0.465)], [X(0.175), Y(-0.45)]], { width: S(0.014), color: '#7a3b30' });
      // A hint of a nose.
      stroke(ctx, [[X(0.0), Y(-0.27)], [X(0.025), Y(-0.3)]], { width: S(0.018), color: 'rgba(160,80,60,0.45)' });
    },
  }));

  // Hair: a cap with a defined hairline, then spikes swept up and back.
  const root = hairC.clone().multiplyScalar(0.55), tip = hairC.clone().lerp(new THREE.Color(0xffc46b), 0.18);
  const hairMat = M.hair(THREE, 0xffffff, true);
  const capGeo = shellGeo(THREE, H, {
    r: 1.07,
    mask: (x, y, z) => ss(y - mix(-0.62, 0.42, ss(z, -0.55, 0.62)) + 0.1 * Math.abs(x) * ss(z, 0, 0.6), -0.04, 0.04),
    bump: (x, y, z) => 0.012 * Math.sin(Math.atan2(x, z) * 14),
    color: (x, y, z, c) => c.copy(root).lerp(hairC, ss(y, -0.4, 0.6)),
  });
  g.add(mesh(THREE, capGeo, hairMat));

  const spike = (d, len, bend, r = 0.21, w = 1.25) => {
    const dir = new THREE.Vector3(...d).normalize();
    const b = new THREE.Vector3(...bend);
    const P = (k, extra) => dir.clone().multiplyScalar(k).addScaledVector(b, extra);
    const pts = [P(0.78, 0), P(1.04, 0), P(1.04 + len * 0.5, len * 0.28), P(1.04 + len, len * 0.75)].map((v) => [v.x, v.y, v.z]);
    g.add(mesh(THREE, strandGeo(THREE, pts, { r, w, d: 0.85, prof: PROF.spike, colors: [root, tip], colorAt: (t) => ss(t, 0, 0.8) }), hairMat));
  };
  const S1 = [
    [[0, 1, 0.2], 0.62, [0, 0.35, -0.55]], [[0.38, 0.92, 0.1], 0.58, [0.35, 0.25, -0.45]], [[-0.38, 0.92, 0.1], 0.58, [-0.35, 0.25, -0.45]],
    [[0.72, 0.68, -0.05], 0.5, [0.55, 0.1, -0.35]], [[-0.72, 0.68, -0.05], 0.5, [-0.55, 0.1, -0.35]],
    [[0, 0.78, -0.62], 0.6, [0, 0.2, -0.55]], [[0.46, 0.62, -0.64], 0.52, [0.3, 0.05, -0.5]], [[-0.46, 0.62, -0.64], 0.52, [-0.3, 0.05, -0.5]],
    [[0.86, 0.3, -0.42], 0.42, [0.45, -0.15, -0.3]], [[-0.86, 0.3, -0.42], 0.42, [-0.45, -0.15, -0.3]],
    [[0, 0.3, -0.95], 0.48, [0, -0.25, -0.4]], [[0.5, 0.05, -0.86], 0.38, [0.2, -0.35, -0.3]], [[-0.5, 0.05, -0.86], 0.38, [-0.2, -0.35, -0.3]],
    [[0.2, 0.98, -0.25], 0.55, [0.1, 0.3, -0.5]], [[-0.2, 0.98, -0.25], 0.55, [-0.1, 0.3, -0.5]],
  ];
  for (const [d, l, b] of S1) spike(d, l, b);

  // Bangs: flat locks that fall over the forehead and stop above the brows.
  const bang = (x0, tx, ty, r = 0.17) => {
    const a = onShell(THREE, H, x0, 0.86, 0.5, 1.0);
    const b = onShell(THREE, H, x0 * 1.08, 0.66, 0.75, 1.1);
    const c = onShell(THREE, H, mix(x0, tx, 0.6), mix(0.66, ty, 0.6), 0.8, 1.09);
    const e = H.surf(tx, ty);
    e.p.addScaledVector(e.n, 0.05);
    g.add(mesh(THREE, strandGeo(THREE, [[a.x, a.y, a.z], [b.x, b.y, b.z], [c.x, c.y, c.z], [e.p.x, e.p.y, e.p.z]], { r, w: 1.5, d: 0.5, prof: PROF.lock, colors: [hairC, tip] }), hairMat));
  };
  bang(-0.5, -0.66, 0.28, 0.16);
  bang(-0.26, -0.34, 0.25, 0.17);
  bang(0.0, -0.06, 0.24, 0.17);
  bang(0.24, 0.22, 0.27, 0.17);
  bang(0.48, 0.6, 0.3, 0.16);
  // Side locks in front of the ears.
  for (const sx of [-1, 1]) {
    const a = onShell(THREE, H, 0.8 * sx, 0.45, 0.4, 1.02);
    const b = onShell(THREE, H, 0.95 * sx, 0.1, 0.3, 1.08);
    const c = onShell(THREE, H, 0.96 * sx, -0.25, 0.28, 1.08);
    g.add(mesh(THREE, strandGeo(THREE, [[a.x, a.y, a.z], [b.x, b.y, b.z], [c.x, c.y, c.z], [c.x * 0.98, c.y - 0.18, c.z + 0.06]], { r: 0.15, w: 1.4, d: 0.55, prof: PROF.lock, colors: [hairC, tip] }), hairMat));
  }

  // Goggles pushed up on the forehead, on a leather strap that circles the head.
  const n = new THREE.Vector3(0, 1, -0.5).normalize();
  const hgt = 0.3, R = Math.sqrt(1.15 * 1.15 - hgt * hgt);
  const u = new THREE.Vector3(1, 0, 0), v = new THREE.Vector3().crossVectors(n, u).normalize();
  const C0 = n.clone().multiplyScalar(hgt);
  const ring = (a) => C0.clone().addScaledVector(u, R * Math.cos(a)).addScaledVector(v, R * Math.sin(a));
  const strapPts = [];
  for (let k = 0; k < 120; k++) strapPts.push(ring((k / 120) * Math.PI * 2));
  const strap = M.leather(THREE, 0x3b2a22);
  g.add(mesh(THREE, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(strapPts, true), 240, 0.05, 12, true), strap, { s: [1, 1, 1] }));
  const brass = M.metal(THREE, 0xc9a25a, 0.3);
  const rubber = M.leather(THREE, 0x2a2624, { roughness: 0.55, clearcoat: 0.2 });
  const lens = new THREE.MeshPhysicalMaterial({ color: 0x2ea7a0, metalness: 0.2, roughness: 0.04, clearcoat: 1, clearcoatRoughness: 0.02, iridescence: 0.5, iridescenceIOR: 1.5 });
  const front = -Math.PI / 2;
  for (const sx of [-1, 1]) {
    const pt = ring(front + 0.3 * sx);
    const gg = new THREE.Group();
    gg.position.copy(pt);
    gg.lookAt(pt.clone().multiplyScalar(2));
    gg.add(mesh(THREE, new THREE.CylinderGeometry(0.2, 0.21, 0.14, 64), rubber, { r: [Math.PI / 2, 0, 0], p: [0, 0, 0.05] }));
    gg.add(mesh(THREE, new THREE.TorusGeometry(0.19, 0.035, 20, 64), brass, { p: [0, 0, 0.13] }));
    gg.add(mesh(THREE, new THREE.SphereGeometry(0.17, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2), lens, { r: [Math.PI / 2, 0, 0], p: [0, 0, 0.11], s: [1, 0.45, 1] }));
    g.add(gg);
  }
  const bridgeA = ring(front - 0.12), bridgeB = ring(front + 0.12);
  g.add(mesh(THREE, new THREE.TubeGeometry(new THREE.CatmullRomCurve3([bridgeA, ring(front).multiplyScalar(1.04), bridgeB]), 24, 0.03, 10), brass));

  // Neck, a high-collared jacket and a scarf.
  g.add(neck(THREE, H));
  const B = makeBust(THREE, { shoulder: 0.88, base: 0x223152 });
  g.add(mesh(THREE, B.geo, M.fabric(THREE, 0xffffff, { vc: true, tint: 0x223152 })));
  const scarfC = 0xf3e7d3;
  const scarf = new THREE.TorusGeometry(0.42, 0.15, 40, 160);
  deform(scarf, (q) => {
    const a = Math.atan2(q.y, q.x);
    const rr = Math.hypot(q.x, q.y);
    const k = 1 + 0.03 * Math.sin(a * 7);
    q.x *= k; q.y *= k;
    q.z *= 1 + 0.12 * Math.sin(a * 5 + 1);
    void rr;
  });
  g.add(mesh(THREE, scarf, M.fabric(THREE, scarfC, { sheenMix: 0.2 }), { p: [0, -0.98, 0.02], r: [Math.PI / 2 - 0.12, 0, 0], s: [1.08, 1, 1] }));
  g.add(mesh(THREE, strandGeo(THREE, [[0.22, -1.0, 0.42], [0.36, -1.18, 0.52], [0.44, -1.38, 0.5], [0.58, -1.6, 0.42]], { r: 0.13, w: 1.6, d: 0.45, prof: PROF.tail, out: [0, 0, 1] }), M.fabric(THREE, scarfC, { sheenMix: 0.2 })));
  return g;
}

function star(THREE, { accent } = {}) {
  const g = new THREE.Group();
  // Her own hair is sakura pink, too close to Rose's bright tone, so her Rose is a deep, clear
  // raspberry on the swatch's hue instead (CIE76 25 from Original in the render, not 15).
  const hairC = new THREE.Color(accent === ACCENTS.rose[0] ? 0xbc1452 : accent ?? 0xf3a2bd);
  const H = makeHead(THREE, { skin: SKIN.porcelain, jaw: 0.15, blush: 0.35 });
  g.add(H.mesh);

  g.add(faceDecal(THREE, H, {
    draw(ctx, k) {
      const { X, Y, S } = k;
      blush(ctx, k, { x: 0.56, y: -0.33, r: 0.17, a: 0.55, color: 0xff8fa3 });
      for (const sx of [-1, 1]) {
        animeEye(ctx, { x: X(0.37 * sx), y: Y(-0.12), w: S(0.33), h: S(0.42), side: sx, star: true, iris: ['#3d1640', '#8e3a86', '#f28fc0', '#ffd0e4'] });
        stroke(ctx, [[X(0.2 * sx), Y(0.2)], [X(0.36 * sx), Y(0.26)], [X(0.52 * sx), Y(0.21)]], { width: S(0.022), color: rgba(hairC.clone().multiplyScalar(0.6).getHex()) });
      }
      // Small open smile.
      ctx.beginPath();
      ctx.moveTo(X(-0.075), Y(-0.48));
      ctx.quadraticCurveTo(X(0), Y(-0.5), X(0.075), Y(-0.48));
      ctx.quadraticCurveTo(X(0.05), Y(-0.6), X(0), Y(-0.6));
      ctx.quadraticCurveTo(X(-0.05), Y(-0.6), X(-0.075), Y(-0.48));
      ctx.closePath();
      ctx.fillStyle = '#9e3046';
      ctx.fill();
      ctx.save();
      ctx.clip();
      ctx.fillStyle = '#ff8d9c';
      ctx.beginPath();
      ctx.ellipse(X(0), Y(-0.6), S(0.05), S(0.035), 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    },
  }));

  const root = hairC.clone().multiplyScalar(0.78), tip = hairC.clone().lerp(new THREE.Color(0xffffff), 0.28);
  const hairMat = M.hair(THREE, 0xffffff, true);
  // Bob: full at the back and sides, ending at the jaw.
  const cap = shellGeo(THREE, H, {
    r: 1.08,
    mask: (x, y, z) => ss(y - mix(-0.7, 0.48, ss(z, -0.2, 0.65)), -0.04, 0.04) * ss(y, -0.9, -0.78),
    bump: (x, y, z) => 0.1 * ss(-y, -0.2, 0.55) * (1 - ss(z, 0.3, 0.7)) + 0.012 * Math.sin(Math.atan2(x, z) * 18),
    color: (x, y, z, c) => c.copy(root).lerp(hairC, ss(y, -0.6, 0.7)).lerp(tip, 0.4 * ss(-y, 0.4, 0.8)),
  });
  g.add(mesh(THREE, cap, hairMat));
  // Bob ends: locks curling under around the back.
  for (let k = 0; k <= 12; k++) {
    const a = mix(-2.45, 2.45, k / 12);
    const dx = Math.sin(a), dz = Math.cos(a);
    if (dz > 0.45) continue;
    const a0 = onShell(THREE, H, dx, -0.2, dz, 1.12);
    const a1 = onShell(THREE, H, dx, -0.62, dz, 1.2);
    const a2 = onShell(THREE, H, dx * 0.9, -0.86, dz * 0.9, 1.12);
    g.add(mesh(THREE, strandGeo(THREE, [[a0.x, a0.y, a0.z], [a1.x, a1.y, a1.z], [a2.x, a2.y, a2.z], [a2.x * 0.88, a2.y - 0.02, a2.z * 0.88]], { r: 0.17, w: 1.5, d: 0.6, prof: PROF.lock, colors: [hairC, tip] }), hairMat));
  }
  // Bangs, parted slightly off center.
  const bang = (x0, tx, ty, r = 0.15) => {
    const a = onShell(THREE, H, x0, 0.88, 0.45, 1.02);
    const b = onShell(THREE, H, x0 * 1.1, 0.62, 0.78, 1.11);
    const e = H.surf(tx, ty);
    e.p.addScaledVector(e.n, 0.045);
    const c = onShell(THREE, H, mix(x0, tx, 0.65), mix(0.62, ty, 0.6), 0.85, 1.08);
    g.add(mesh(THREE, strandGeo(THREE, [[a.x, a.y, a.z], [b.x, b.y, b.z], [c.x, c.y, c.z], [e.p.x, e.p.y, e.p.z]], { r, w: 1.55, d: 0.5, prof: PROF.lock, colors: [hairC, tip] }), hairMat));
  };
  bang(-0.6, -0.76, 0.2, 0.15);
  bang(-0.4, -0.5, 0.28, 0.16);
  bang(-0.18, -0.24, 0.3, 0.15);
  bang(0.02, 0.04, 0.28, 0.15);
  bang(0.22, 0.3, 0.3, 0.16);
  bang(0.42, 0.55, 0.29, 0.16);
  bang(0.62, 0.78, 0.2, 0.15);
  // Long side locks framing the face.
  for (const sx of [-1, 1]) {
    const pts = [onShell(THREE, H, 0.78 * sx, 0.55, 0.5, 1.02), onShell(THREE, H, 0.97 * sx, 0.05, 0.4, 1.1), onShell(THREE, H, 0.92 * sx, -0.45, 0.5, 1.1)];
    const end = H.surf(0.68 * sx, -0.72);
    pts.push(end.p.addScaledVector(end.n, 0.1));
    g.add(mesh(THREE, strandGeo(THREE, pts.map((q) => [q.x, q.y, q.z]), { r: 0.17, w: 1.5, d: 0.55, prof: PROF.lock, colors: [hairC, tip] }), hairMat));
  }
  // The single antenna lock on top.
  g.add(mesh(THREE, strandGeo(THREE, [[0.05, 0.95, 0.15], [0.1, 1.25, 0.25], [0.28, 1.42, 0.22], [0.38, 1.35, 0.32]], { r: 0.075, w: 1.4, d: 0.8, prof: PROF.spike, out: [0, 0, 1], colors: [hairC, tip] }), hairMat));

  // Star clip.
  const starGeo = extrude(THREE, (s) => {
    for (let k = 0; k < 10; k++) {
      const a = (k / 10) * Math.PI * 2 + Math.PI / 2, rr = k % 2 ? 0.075 : 0.17;
      if (k === 0) s.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); else s.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    s.closePath();
  }, { depth: 0.04, bevel: 0.03, seg: 5 });
  starGeo.center();
  const clip = mesh(THREE, starGeo, new THREE.MeshPhysicalMaterial({ color: 0xf6c443, metalness: 0.65, roughness: 0.2, clearcoat: 1, clearcoatRoughness: 0.05 }));
  const cp = onShell(THREE, H, 0.6, 0.6, 0.62, 1.14);
  clip.position.copy(cp);
  clip.lookAt(cp.clone().multiplyScalar(2));
  clip.rotateZ(0.25);
  g.add(clip);

  // Blouse and a ribbon bow.
  g.add(neck(THREE, H, 0.25));
  const B = makeBust(THREE, { shoulder: 0.82, base: 0xf5f1ea });
  g.add(mesh(THREE, B.geo, M.fabric(THREE, 0xffffff, { vc: true, tint: 0xf5f1ea, sheenMix: 0.2 })));
  const ribbon = M.fabric(THREE, 0x1f8f8a, { roughness: 0.5, sheenRoughness: 0.35, sheenMix: 0.55 });
  const bowG = new THREE.Group();
  const { wing } = bowGeo(THREE, 1.05);
  for (const sx of [-1, 1]) bowG.add(mesh(THREE, wing, ribbon, { s: [sx, 1, 1], r: [0, 0, 0.12 * sx], p: [0.03 * sx, 0, 0] }));
  bowG.add(mesh(THREE, new THREE.SphereGeometry(0.075, 32, 24), ribbon, { s: [1, 1.2, 0.8], p: [0, 0, 0.04] }));
  for (const sx of [-1, 1]) {
    bowG.add(mesh(THREE, strandGeo(THREE, [[0.02 * sx, -0.03, 0.04], [0.09 * sx, -0.18, 0.06], [0.14 * sx, -0.33, 0.05]], { r: 0.07, w: 1.3, d: 0.35, prof: (t) => 1 - 0.1 * t, out: [0, 0, 1], cap: true }), ribbon));
  }
  bowG.position.set(0, -1.06, B.zAt(0, -1.06) + 0.04);
  bowG.rotation.x = -0.25;
  g.add(bowG);
  return g;
}

function ninja(THREE, { deep } = {}) {
  const g = new THREE.Group();
  const cloth = new THREE.Color(deep ?? 0x2b344c);
  const H = makeHead(THREE, { skin: SKIN.umber, jaw: 0.1, blush: 0.12 });
  g.add(H.mesh);

  g.add(faceDecal(THREE, H, {
    draw(ctx, k) {
      const { X, Y, S } = k;
      for (const sx of [-1, 1]) {
        animeEye(ctx, { x: X(0.34 * sx), y: Y(-0.07), w: S(0.3), h: S(0.25), side: sx, sharp: 0.7, iris: ['#14202e', '#2f5677', '#8cc2e4', '#cfe9ff'], lash: '#120c0a' });
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(X(0.13 * sx), Y(0.05));
        ctx.lineTo(X(0.52 * sx), Y(0.12));
        ctx.lineTo(X(0.5 * sx), Y(0.09));
        ctx.lineTo(X(0.15 * sx), Y(0.025));
        ctx.closePath();
        ctx.fillStyle = '#1a110d';
        ctx.fill();
        ctx.restore();
      }
    },
  }));

  // Hood and mask: one wrap of cloth with a slot left open for the eyes.
  const slot = (x, y, z) => ss(y, -0.26, -0.22) * (1 - ss(y, 0.14, 0.18)) * ss(z, 0.36, 0.5);
  const hood = shellGeo(THREE, H, {
    r: 1.06,
    inner: 0.9,
    mask: (x, y, z) => 1 - slot(x, y, z),
    bump: (x, y, z) => {
      const folds = 0.012 * Math.sin(y * 34 + 0.6 * Math.sin(x * 6)) * ss(-y, 0.32, 0.6) * ss(z, 0.2, 0.7);
      const crown = 0.01 * Math.sin(Math.atan2(x, z) * 9) * ss(y, 0.4, 0.9);
      return folds + crown;
    },
  });
  const clothMat = M.fabric(THREE, cloth, { roughness: 0.85, sheenMix: 0.35 });
  g.add(mesh(THREE, hood, clothMat));
  // Rolled edges above and below the slot.
  const edge = (y, r) => {
    const pts = [];
    for (let k = 0; k <= 40; k++) {
      const a = mix(-1.1, 1.1, k / 40);
      const p = onShell(THREE, H, Math.sin(a), y, Math.cos(a), 1.055);
      pts.push(p);
    }
    g.add(mesh(THREE, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 120, r, 16), clothMat));
  };
  edge(0.16, 0.04);
  edge(-0.24, 0.045);
  // Headband with a knot and two tails at the back.
  const band = M.fabric(THREE, 0xb3352e, { roughness: 0.7, sheenMix: 0.4 });
  const bandY = (z) => mix(0.27, 0.43, ss(z, -1, 1));
  g.add(mesh(THREE, shellGeo(THREE, H, {
    r: 1.1, inner: 0.98,
    mask: (x, y, z) => ss(y, bandY(z) - 0.1, bandY(z) - 0.08) * (1 - ss(y, bandY(z) + 0.08, bandY(z) + 0.1)),
    bump: (x, y, z) => 0.006 * Math.sin(Math.atan2(x, z) * 30),
  }), band));
  const knot = onShell(THREE, H, 0, 0.27, -1, 1.14);
  g.add(mesh(THREE, new THREE.SphereGeometry(0.11, 32, 24), band, { p: [knot.x, knot.y, knot.z], s: [1.2, 1, 0.8] }));
  for (const [sx, drop] of [[1, 0.0], [-1, 0.12]]) {
    const k0 = [knot.x, knot.y, knot.z];
    g.add(mesh(THREE, strandGeo(THREE, [k0, [0.25 * sx, k0[1] - 0.05 - drop, k0[2] - 0.2], [0.55 * sx, k0[1] - 0.18 - drop, k0[2] - 0.32], [0.82 * sx, k0[1] - 0.12 - drop * 1.5, k0[2] - 0.4]], { r: 0.1, w: 1.5, d: 0.3, prof: PROF.tail, out: [0, 1, 0] }), band));
  }

  // Wrapped jacket with a crossed collar.
  const B = makeBust(THREE, { shoulder: 0.9, base: cloth });
  g.add(mesh(THREE, B.geo, M.fabric(THREE, 0xffffff, { vc: true, tint: cloth, roughness: 0.85, sheenMix: 0.35 })));
  g.add(mesh(THREE, new THREE.CylinderGeometry(0.33, 0.4, 0.42, 64), clothMat, { p: [0, -0.86, -0.05] }));
  for (const sx of [-1, 1]) {
    const flap = extrude(THREE, (s) => {
      s.moveTo(0.36 * sx, -1.0);
      s.lineTo(0.46 * sx, -1.06);
      s.lineTo(-0.12 * sx, -1.62);
      s.lineTo(-0.26 * sx, -1.56);
      s.closePath();
    }, { depth: 0.02, bevel: 0.015, seg: 3 });
    g.add(mesh(THREE, onChest(B, flap, sx > 0 ? 0.01 : 0.04), M.fabric(THREE, cloth.clone().multiplyScalar(0.8), { roughness: 0.85 })));
  }
  return g;
}

function neko(THREE, { accent } = {}) {
  const g = new THREE.Group();
  const hoodC = new THREE.Color(accent ?? 0xece0cb);
  const H = makeHead(THREE, { skin: SKIN.sand, jaw: 0.16, blush: 0.3 });
  g.add(H.mesh);

// A thin rounded slab, used for small flat pieces.
function RoundedSlab(THREE, w, h, d) {
  const r = Math.min(w, h) * 0.45;
  return extrude(THREE, (s) => {
    s.moveTo(-w / 2 + r, -h / 2);
    s.lineTo(w / 2 - r, -h / 2);
    s.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
    s.lineTo(w / 2, h / 2 - r);
    s.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2);
    s.lineTo(-w / 2 + r, h / 2);
    s.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);
    s.lineTo(-w / 2, -h / 2 + r);
    s.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
  }, { depth: d * 0.4, bevel: d * 0.3, seg: 3 });
}
