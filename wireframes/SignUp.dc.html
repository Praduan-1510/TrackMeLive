<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign-up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&display=swap">
<style>
body{margin:0}
a{color:#222222}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 20px; display: flex; flex-direction: column; gap: 14px; background: #FFFFFF; color: #222222; font-family: 'Balsamiq Sans', 'Comic Sans MS', 'Chalkboard SE', system-ui, sans-serif; font-size: 15px; line-height: 1.4">
  <div style="display: flex; align-items: center; min-height: 44px">
    <a href="Main.dc.html" style="display: flex; align-items: center; min-height: 44px; padding-right: 8px; color: #222222; font-weight: 700">‹ Back</a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 24px; line-height: 1.2">Create your account</h1>
    <p style="margin: 0; color: #4D4D4D">Your name goes on your live map. Your number keeps the account yours.</p>
  </div>

  <div style="display: flex; flex-direction: column; border: 2px solid #222222; border-radius: 14px; overflow: hidden">
    <label style="display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border-bottom: 2px solid #D6D6D6">
      <span style="font-size: 13px; color: #6B6B6B">Name</span>
      <input type="text" value="Alex" autocomplete="name" style="min-height: 28px; padding: 0; border: 0; background: transparent; color: #222222; font-family: inherit; font-size: 17px">
    </label>
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 14px">
      <label for="su-phone" style="font-size: 13px; color: #6B6B6B">Mobile number</label>
      <div style="display: flex; align-items: center; gap: 10px">
        <button type="button" aria-label="Country code, US +1" style="flex: none; min-height: 36px; padding: 0 10px; border: 2px solid #8A8A8A; border-radius: 8px; background: #F4F4F4; color: #222222; font-family: inherit; font-size: 14px; font-weight: 700">US +1 ▾</button>
        <input id="su-phone" type="tel" value="(415) 555-0142" autocomplete="tel-national" style="flex: 1; min-width: 0; min-height: 36px; padding: 0; border: 0; background: transparent; color: #222222; font-family: inherit; font-size: 17px">
      </div>
    </div>
  </div>
  <p style="margin: 0; color: #6B6B6B; font-size: 13px">People you share with see your name and mascot, never your number.</p>

  <div style="flex: 1"></div>

  <div style="font-size: 12px; color: #4D4D4D">[ The same two steps sign you back in on a new phone. ]</div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <a href="SignUpCode.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 12px; background: #222222; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 17px">Send code</a>
    <div style="text-align: center; color: #6B6B6B; font-size: 13px">We'll text you a 6-digit code. Message and data rates may apply.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
