# Same daemon settings as code/android: 2 GB heap leaves room for the emulator on a 16 GB Mac, and
# preferIPv4Stack works around Java TLS handshakes failing on dual-stack sockets in some sandboxes.
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.caching=true
