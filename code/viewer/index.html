<!doctype html>
<!--
  Track Me Live web viewer: the page a viewer opens from a share link, in any browser, with no
  install. The map behind everything, a glass bar and a glass sheet over it. The loading skeleton
  below paints before any script runs (src/ui/templates.ts loadingMain draws the same); src/main.ts
  then takes over. The sample and review links make no requests beyond this origin; a share link
  (/s/{token}) talks to Firebase (src/session/), and with a Maps key, to the Maps API for street names.

  npm run dev (http://localhost:5173) · npm test · npm run test:e2e · npm run test:e2e:live · npm run lint · npm run build
  Review: ?state=<scenario> (src/sample/scenarios.ts), ?theme=light|dark
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Loading · Track Me Live</title>
    <meta name="description" content="A live location, shared with you by link. Opens in your browser.">
    <!-- Share links are private: keep them out of search results, and keep the link out of the
         Referer header. strict-origin sends only the origin (never the /s/<token> path), and
         nothing from https to http, so Maps keys can still be restricted by website (code/OPEN-DECISIONS.md). -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <!-- Gabarito sets the heading; text uses SF Pro on Apple devices, so Figtree isn't preloaded. -->
    <link rel="preload" href="/fonts/gabarito-latin.woff2" as="font" type="font/woff2" crossorigin>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <!-- While the page trades the link for a session: a skeleton, never a blank map. -->
    <main class="vp" aria-busy="true" aria-labelledby="vp-h1">
      <div class="glassbar skel" aria-hidden="true"><span class="sk av"></span><span class="sk-lines"><span class="sk w60"></span><span class="sk w40"></span></span></div>
      <div class="vp-body"><div class="vp-gap"></div>
        <div class="sheet skel"><div class="grab" aria-hidden="true"></div><span class="sk w70 tall" aria-hidden="true"></span><span class="sk w90" aria-hidden="true"></span><span class="sk w50" aria-hidden="true"></span><h1 class="sr-only" id="vp-h1" tabindex="-1">Loading the live location</h1></div>
      </div>
    </main>
    <div id="map" class="map" role="region" aria-label="Map"></div>
    <!-- Announcements: one polite region for changes only, and an alert kept for the ended heading. -->
    <div id="status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="alert" class="sr-only" role="alert" aria-atomic="true"></div>
    <noscript><p class="noscript">Track Me Live needs JavaScript to show the live map. Turn it on for this site and reload the page.</p></noscript>
  </body>
</html>
