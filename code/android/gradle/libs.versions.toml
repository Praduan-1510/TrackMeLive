# Exact versions, all published before Oct 4, 2026 and at least two weeks before they were added.
# compileSdk is 36: anything whose AAR asks for compileSdk 37 (Compose 1.12, androidx.core 1.19,
# Lifecycle 2.11) stays out until we move to 37. See README.md for why each one.
[versions]
agp = "9.4.1"                 # Android Gradle Plugin, Sep 18 2026 (built-in Kotlin)
kotlin = "2.4.20"             # Kotlin + Compose compiler plugin, Sep 7 2026
composeBom = "2026.06.01"     # Compose 1.11.4, Material 3 1.4.0; the newest BOM that builds against compileSdk 36
activityCompose = "1.13.0"    # Mar 11 2026; pulls androidx.core 1.18.0 (compileSdk 36)
lifecycle = "2.10.0"          # Nov 19 2025; 2.11 needs compileSdk 37
navigation3 = "1.1.7"         # Aug 26 2026; 1.2 needs compileSdk 37
datastore = "1.2.1"           # Mar 11 2026
firebaseBom = "34.19.0"       # Sep 9 2026: Auth 24.2.0, Firestore 26.6.0, Functions 22.1.1
coroutines = "1.11.0"         # May 7 2026
libphonenumber = "9.0.40"     # Sep 23 2026; Google's phone number metadata and parser
playServicesLocation = "21.4.0" # Jun 25 2026; the fused location provider (play-services-base/basement 18.9.0)
maplibre = "13.6.1"           # Sep 8 2026; MapLibre Native for Android, the live map on OpenFreeMap tiles. 13.7.1
                              # (Oct 15) is too new. The OpenGL ES build: 13.x's plain android-sdk is Vulkan-only
junit = "4.13.2"
robolectric = "4.17"          # Sep 10 2026
androidxTestCore = "1.7.0"    # Jul 30 2025
androidxTestRunner = "1.7.0"  # Jul 30 2025
androidxTestExtJunit = "1.3.0" # Jul 30 2025

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
firebase-functions = { group = "com.google.firebase", name = "firebase-functions" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" } # 25.1.3 from the BOM, Sep 9 2026: the alerts' push token
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
libphonenumber = { group = "com.googlecode.libphonenumber", name = "libphonenumber", version.ref = "libphonenumber" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
maplibre-android = { group = "org.maplibre.gl", name = "android-sdk-opengl", version.ref = "maplibre" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
