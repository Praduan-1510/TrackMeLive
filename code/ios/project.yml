# Track Me Live for iOS. Generate the Xcode project with:
#   tools/xcodegen/bin/xcodegen generate      (scripts/bootstrap-xcodegen.sh installs XcodeGen)
# run.sh does that, then builds and launches in the Simulator. TrackMeLive.xcodeproj is generated
# and gitignored: change this file, not the project.
name: TrackMeLive

options:
  bundleIdPrefix: live.trackme
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "27.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone. iPad comes later (the design system already covers it).
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your team here (or in Xcode) for device builds. Simulator builds don't need one:
    # run.sh signs them "to run locally".
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_PREVIEWS: YES
    DEAD_CODE_STRIPPING: YES

packages:
  TMLCore:
    path: Packages/TMLCore
  # Firebase Apple SDK 12.19.2, published 2026-09-15: the newest release before the Oct 4, 2026
  # cutoff (13.0.0 came out Oct 7). Only the TrackMeLiveFirebase target uses it; see that target.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: "12.19.2"

targets:
  TrackMeLive:
    type: application
    platform: iOS
    sources:
      - path: TrackMeLive
        excludes:
          - "**/*.md"
      - path: Shared
    dependencies:
      - package: TMLCore
      - target: TrackMeLiveWidgets
        embed: true
        codeSign: true
      # Xcode day, once the TrackMeLiveFirebase scheme builds: uncomment this line, run
      # `tools/xcodegen/bin/xcodegen generate`, and launch with `-backend emulator`
      # (AppDependencies picks it up through `#if canImport(TrackMeLiveFirebase)`).
      # - target: TrackMeLiveFirebase
    info:
      path: TrackMeLive/Info.plist
      properties:
        CFBundleDisplayName: Track Me Live
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Capabilities. Background Modes: location, so a share keeps going in the background after it
        # starts in the app ("While using the app" is all it needs; the app never asks for Always).
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: >-
          Track Me Live uses your location only while you're sharing. Nobody sees it until you send
          your link, and it stops when you do.
        # The share screen's one-time precise request while Precise Location is off for the app
        # (FSD §8; LiveLocationAccess.precisePurposeKey). It lasts for that share only.
        NSLocationTemporaryUsageDescriptionDictionary:
          SharePrecise: >-
            Precise location lets the person you share with see exactly where you are, for this
            share only.
        # The share session's Live Activity (Lock Screen and Dynamic Island), updated often by push.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # Deep links from the Live Activity and the Share location control: trackmelive://share|live|stop
        CFBundleURLTypes:
          - CFBundleURLName: live.trackme.app
            CFBundleURLSchemes:
              - trackmelive
          # Firebase phone sign-in's reCAPTCHA fallback returns here: "app-" plus the Google app ID
          # with dashes. This is the demo project's placeholder ID (FirebaseServices.demoOptions);
          # the real project replaces it with its REVERSED_CLIENT_ID or encoded app ID.
          - CFBundleURLName: live.trackme.app.firebase-auth
            CFBundleURLSchemes:
              - app-1-000000000000-ios-0000000000000000
        # The app delegate forwards APNs and URLs to Firebase Auth itself (AppDelegate.swift).
        FirebaseAppDelegateProxyEnabled: false
        # The Firebase emulators on this Mac are plain HTTP on 127.0.0.1. Local addresses only; every
        # other connection keeps App Transport Security.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: TrackMeLive/TrackMeLive.entitlements
      properties:
        # Push: alerts (link opened, call ended, sharing expired) and Live Activity updates via APNs.
        aps-environment: development
        # App Groups: the app and the widget extension share UserDefaults (pending deep links).
        com.apple.security.application-groups:
          - group.live.trackme.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.trackme.app
        PRODUCT_NAME: TrackMeLive
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

  # The Firebase-backed services (phone sign-in, the profile listener, the saveProfile and
  # deleteAccount callables, the share session's callables, listener and ping writes), in their own
  # static library so nothing in the app depends on the SDK until it builds. The Command Line Tools
  # can't resolve or build the SDK, so this target is outside scripts/typecheck.sh and the
  # TrackMeLive scheme; build it with the TrackMeLiveFirebase scheme (README, "Xcode day").
  #
  # Every module the sources import is listed (FirebaseCore too), each with `link: true`. XcodeGen
  # links a static library's dependencies only into executables by default, which leaves this
  # target without a Link Binary With Libraries phase; Xcode's explicit-module dependency scan then
  # has no module maps for the products' Objective-C modules (FirebaseCore, FirebaseAuthInternal,
  # GTMSessionFetcherCore, the *Interop modules…) and fails with "Unable to resolve module
  # dependency" (CI run 39145630903). A static library's link phase doesn't copy the products
  # into the .a: the app still links them when it links this target (README, Xcode day step 3).
  TrackMeLiveFirebase:
    type: library.static
    platform: iOS
    sources:
      - path: Firebase
        excludes:
          - "**/*.md"
    dependencies:
      - package: TMLCore
        link: true
      - package: Firebase
        product: FirebaseCore
        link: true
      - package: Firebase
        product: FirebaseAuth
        link: true
      - package: Firebase
        product: FirebaseFirestore
        link: true
      - package: Firebase
        product: FirebaseFunctions
        link: true
    settings:
      base:
        PRODUCT_NAME: TrackMeLiveFirebase
        PRODUCT_MODULE_NAME: TrackMeLiveFirebase
        SKIP_INSTALL: YES

  TrackMeLiveWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TrackMeLiveWidgets
      - path: Shared
    dependencies:
      - package: TMLCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
    info:
      path: TrackMeLiveWidgets/Info.plist
      properties:
        CFBundleDisplayName: Track Me Live
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TrackMeLiveWidgets/TrackMeLiveWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.live.trackme.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.trackme.app.widgets
        PRODUCT_NAME: TrackMeLiveWidgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

schemes:
  TrackMeLiveFirebase:
    build:
      targets:
        TrackMeLiveFirebase: all
  TrackMeLive:
    build:
      targets:
        TrackMeLive: all
        TrackMeLiveWidgets: all
    run:
      config: Debug
      commandLineArguments:
        # Off by default (the fakes). Tick it in the scheme once the app links TrackMeLiveFirebase.
        "-backend emulator": false
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - package: TMLCore/TMLCoreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
